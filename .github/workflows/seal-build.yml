name: seal-build

# Build-and-pack only: the test suite runs on the Travis legs (.travis.yml).
on:
  workflow_dispatch: {}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # The public 1.19 jars were built with JDK 1.8.0_171 (manifest Build-Jdk), cross-compiling to 1.7.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Package
        run: >-
          ./mvnw -B -V -e clean package -DskipTests
          -Drat.skip=true -Djapicmp.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true
          -Dfindbugs.skip=true -Dclirr.skip=true -Danimal.sniffer.skip=true -Dmaven.javadoc.skip=true
          -Dgpg.skip=true -Djacoco.skip=true -Dpmd.skip=true -Dcpd.skip=true
      - uses: actions/upload-artifact@v4
        with:
          name: commons-compress-jars
          path: |
            target/commons-compress-1.19.jar
            target/commons-compress-1.19-tests.jar
          if-no-files-found: error
